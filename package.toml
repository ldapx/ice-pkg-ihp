[[pdk.layer]]
name = "Metal4"
number = 6

[[pdk.layer]]
name = "Metal5"
number = 7

[[pdk.layer]]
name = "TopMetal1"
number = 8

[[pdk.layer]]
name = "TopMetal2"
number = 9

[[pdk.layer]]
name = "MIM"
