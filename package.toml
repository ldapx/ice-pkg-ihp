[package]
schema_version = 1
name = "ihp.sg13g2"
version = "0.1.1"
description = "IHP SG13G2 130 nm BiCMOS open-source PDK"
license = "Apache-2.0"

[source]
type = "git"
url = "https://github.com/IHP-GmbH/IHP-Open-PDK.git"
revision = "main"

[provides]
pdk = true
models = true
symbols = true
layout = true
dummy_fill = true
pcells = true
verification = true
implementation = true

[trust]
trusted = false

[pdk]
display_name = "IHP SG13G2"
default_schematic = "ihp_top"

id = "ihp-sg13g2"
aliases = ["ihp.sg13g2"]
manufacturing_grid = 5

[[pdk.layer]]
name = "Metal1.pin"
number = 8
datatype = 2
minimum_width = 0

[[pdk.layer]]
name = "Metal1.text"
number = 8
datatype = 25
minimum_width = 0

[[pdk.layer]]
name = "Metal2.pin"
number = 10
datatype = 2
minimum_width = 0

[[pdk.layer]]
name = "Metal2.text"
number = 10
datatype = 25
minimum_width = 0

[[pdk.layer]]
name = "pSD.drawing"
number = 14
datatype = 0
minimum_width = 0

[[pdk.layer]]
name = "Metal3.pin"
number = 30
datatype = 2
minimum_width = 0

[[pdk.layer]]
name = "Metal3.text"
number = 30
datatype = 25
minimum_width = 0

[[pdk.layer]]
name = "Metal4.pin"
number = 50
datatype = 2
minimum_width = 0

[[pdk.layer]]
name = "Metal4.text"
number = 50
datatype = 25
minimum_width = 0

[[pdk.layer]]
name = "Metal5.pin"
number = 67
datatype = 2
minimum_width = 0

[[pdk.layer]]
name = "Metal5.text"
number = 67
datatype = 25
minimum_width = 0

[[pdk.layer]]
name = "TopMetal1.pin"
number = 126
datatype = 2
minimum_width = 0

[[pdk.layer]]
name = "TopMetal1.text"
number = 126
datatype = 25
minimum_width = 0

[[pdk.layer]]
name = "TopMetal2.pin"
number = 134
datatype = 2
minimum_width = 0

[[pdk.layer]]
name = "TopMetal2.text"
number = 134
datatype = 25
minimum_width = 0

[[pdk.layer]]
name = "prBoundary.boundary"
number = 189
datatype = 4
minimum_width = 0

[pdk.implementation]
engine = "openroad"
synthesis = "yosys"
min_openroad = "2.0"
min_yosys = "0.40"
site = "CoreSite"
tech_lef = "implementation/stacks/default/tech.lef"
cell_lef = "implementation/common/cells.lef"
gds = "implementation/common/stdcells.gds"
layer_map = "implementation/common/layer.map"
io_horizontal_layers = ["Metal3"]
io_vertical_layers = ["Metal2"]
routing_min_layer = "Metal1"
routing_max_layer = "Metal5"
pdn_script = "implementation/common/scripts/pdn.tcl"
fill_cells = ["sg13g2_fill_8", "sg13g2_fill_4", "sg13g2_fill_2", "sg13g2_fill_1"]
rcx_rules = "implementation/stacks/default/rcx.rules"

[pdk.implementation.liberty]
tt = ["implementation/common/lib/sg13g2_stdcell_typ_1p20V_25C.lib.gz"]
ff = ["implementation/common/lib/sg13g2_stdcell_fast_1p32V_m40C.lib.gz"]
ss = ["implementation/common/lib/sg13g2_stdcell_slow_1p08V_125C.lib.gz"]
tt_1p50 = ["implementation/common/lib/sg13g2_stdcell_typ_1p50V_25C.lib.gz"]
ff_1p65 = ["implementation/common/lib/sg13g2_stdcell_fast_1p65V_m40C.lib.gz"]
ss_1p35 = ["implementation/common/lib/sg13g2_stdcell_slow_1p35V_125C.lib.gz"]

[pdk.simulation]
engine = "ngspice"
root = "simulation/ngspice"
model_file = "models/cornerMOSlv.lib"
section = "mos_tt"
includes = []
options = []
requires_osdi = true
verilog_a = "simulation/verilog-a"
compiler_flags = ["-D__NGSPICE__"]

[pdk.simulation.devices]
nmos = "sg13_lv_nmos"
pmos = "sg13_lv_pmos"

[pdk.simulation.probe]
w = "1u"
l = "0.13u"
vdd = 1.2
vd = 0.6

[[pdk.simulation.osdi]]
source = "simulation/verilog-a/psp103/psp103.va"
output = "psp103.osdi"

[[pdk.simulation.osdi]]
source = "simulation/verilog-a/psp103/psp103_nqs.va"
output = "psp103_nqs.osdi"

[[pdk.simulation.osdi]]
source = "simulation/verilog-a/r3_cmc/r3_cmc.va"
output = "r3_cmc.osdi"

[[pdk.simulation.osdi]]
source = "simulation/verilog-a/mosvar/mosvar.va"
output = "mosvar.osdi"

[[pdk.simulation.osdi]]
source = "simulation/verilog-a/cap_cmomi/cap_cmomi.va"
output = "cap_cmomi.osdi"

[[pdk.simulation.osdi]]
source = "simulation/verilog-a/cap_cmomf/cap_cmomf.va"
output = "cap_cmomf.osdi"

